[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionmanager"
version = "0.1.0"
description = "Safely inspect and remove local Codex and Kimi Code sessions"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
sessionmanager = "sessionmanager.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
